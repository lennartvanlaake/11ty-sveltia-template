# Sveltia CMS configuration.
#
# This starter uses Sveltia's LOCAL workflow:
# 1. Run `bun run serve`.
# 2. Open http://localhost:8080/admin/.
# 3. Choose "Work with Local Repository" and select this project folder.
#
# No OAuth server or third-party account is required for local editing.
# The backend below is still required by Sveltia's configuration format.
# Replace the placeholder only if you later enable live GitHub editing.
backend:
  name: github
  repo: your-github-user/your-repo
  branch: main

# Live GitHub editing is intentionally not configured.
# If you enable it later, deploy Sveltia CMS Authenticator (Cloudflare Workers)
# and uncomment `base_url`:
# https://sveltiacms.app/en/docs/backends/github
# base_url: https://your-authenticator.example.workers.dev

# Uploaded images are stored in this folder and served from this URL.
media_folder: "assets/img"
public_folder: "/assets/img"

collections:
  # Blog posts are Markdown files in posts/.
  # Layout, URL, and the internal "post" tag come from posts/posts.11tydata.js.
  - name: "posts"
    label: "Posts"
    label_singular: "Post"
    folder: "posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - {
          label: "Author",
          name: "author",
          widget: "relation",
          collection: "authors",
          value_field: "name",
        }
      - {
          label: "Summary",
          name: "summary",
          widget: "text",
          required: false,
          hint: "Optional one-sentence summary shown above the post body.",
        }
      - {
          label: "Image",
          name: "image",
          widget: "image",
          required: false,
          hint: "Optional image uploaded to assets/img.",
        }
      - {
          label: "Image Alt Text",
          name: "imageAltText",
          widget: "string",
          required: false,
          hint: "Describe the image for screen readers.",
        }
      - { label: "Body", name: "body", widget: "markdown" }

  # Regular pages are Markdown files in pages/.
  # Layout and URL come from pages/pages.11tydata.js.
  - name: "pages"
    label: "Pages"
    label_singular: "Page"
    folder: "pages"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - {
          label: "Description",
          name: "description",
          widget: "text",
          required: false,
        }
      - label: "Navigation"
        name: "eleventyNavigation"
        widget: "object"
        required: false
        fields:
          - { label: "Key", name: "key", widget: "string" }
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Order", name: "order", widget: "number", default: 999 }
      - {
          label: "Body",
          name: "body",
          widget: "markdown",
          hint: "Plain Markdown. Do not add template syntax here.",
        }

  # Authors are Markdown files in authors/.
  # The post author field references this collection by display name.
  - name: "authors"
    label: "Authors"
    label_singular: "Author"
    icon: "person"
    folder: "authors"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - {
          label: "Image",
          name: "image",
          widget: "image",
          required: false,
          hint: "Optional author photo.",
        }
      - {
          label: "Description",
          name: "body",
          widget: "markdown",
          hint: "A short author bio.",
        }

  # Site settings live in _data/settings.yml.
  - name: "settings"
    label: "Settings"
    icon: "settings"
    files:
      - file: "_data/settings.yml"
        label: "Site Settings"
        name: "site"
        format: "yaml"
        fields:
          - { label: "Site Title", name: "title", widget: "string" }
          - { label: "Site Description", name: "description", widget: "text" }
          - { label: "Site URL", name: "url", widget: "string" }
